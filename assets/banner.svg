<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="300">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#222427"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2b714"/>
      <stop offset="100%" stop-color="#f8d752"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2b714" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#e2b714" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e2b714" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#e2b714" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2b714" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { fill: #4cd964; opacity: 1; filter: drop-shadow(0 0 4px #4cd964); }
        50% { fill: #34c759; opacity: 0.45; filter: drop-shadow(0 0 1px #34c759); }
      }
      .cursor {
        animation: blink 0.9s step-end infinite;
      }
      .wave-stream {
        stroke-dasharray: 10 5;
        animation: dashFlow 1.8s linear infinite;
      }
      .status-pulse {
        animation: pulseDot 2.2s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Ubuntu", sans-serif;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Card Shell -->
  <rect x="2" y="2" width="916" height="296" rx="14" fill="url(#cardBg)" stroke="#2d2f34" stroke-width="1.5"/>

  <!-- Top Terminal Titlebar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 42 L 2 42 Z" fill="#131416"/>
  <line x1="2" y1="42" x2="918" y2="42" stroke="#282a2e" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="26" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="5" fill="#27c93f"/>

  <!-- Header Title -->
  <text x="460" y="26" text-anchor="middle" fill="#646669" font-size="11.5" font-weight="600" letter-spacing="1">
    HUMANOID-TYPING-ENGINE // NEUROMUSCULAR MOTOR CORE
  </text>

  <!-- Live Status -->
  <circle cx="888" cy="22" r="4" class="status-pulse"/>
  <text x="876" y="26" text-anchor="end" fill="#888c91" font-size="10.5" font-weight="600" letter-spacing="0.5">READY</text>

  <!-- ================= LEFT SECTION (Content & Prompt) ================= -->
  <!-- Main Title -->
  <text x="40" y="88" fill="url(#goldText)" font-size="26" font-weight="800" letter-spacing="0.4">
    Humanoid Auto-Typer
  </text>

  <!-- Subtitle Lines (strictly bound to left half to prevent any collision) -->
  <text x="40" y="113" fill="#9da2a8" font-size="13" font-weight="500">
    Neuromuscular Motor Cadence &amp; Key Rollover
  </text>
  <text x="40" y="131" fill="#646669" font-size="12" font-weight="400">
    Anti-Cheat Evasion Core for Monkeytype &amp; Keybr
  </text>

  <!-- Command Prompt Container -->
  <g transform="translate(40, 146)">
    <rect width="445" height="36" rx="7" fill="#111214" stroke="#25272a" stroke-width="1"/>
    <text x="14" y="23" fill="#e2b714" class="code-font" font-size="13" font-weight="700">&gt;</text>
    <text x="32" y="23" fill="#d1d0c5" class="code-font" font-size="12" font-weight="500">engine.engage({ wpm: 500, mode: "stream" })</text>
    <rect x="382" y="12" width="7" height="15" fill="#e2b714" class="cursor"/>
  </g>

  <!-- ================= RIGHT SECTION (2x2 Balanced Telemetry Grid) ================= -->
  <!-- Metric Card 1: Throughput -->
  <g transform="translate(510, 68)">
    <rect width="180" height="52" rx="8" fill="#151618" stroke="#282a2e" stroke-width="1"/>
    <text x="14" y="21" fill="#646669" font-size="9.5" font-weight="700" letter-spacing="0.8">THROUGHPUT</text>
    <text x="14" y="42" fill="#e2b714" font-size="15" font-weight="800">30 – 500 WPM</text>
  </g>

  <!-- Metric Card 2: Latency Distribution -->
  <g transform="translate(702, 68)">
    <rect width="180" height="52" rx="8" fill="#151618" stroke="#282a2e" stroke-width="1"/>
    <text x="14" y="21" fill="#646669" font-size="9.5" font-weight="700" letter-spacing="0.8">LATENCY MODEL</text>
    <text x="14" y="42" fill="#d1d0c5" font-size="14.5" font-weight="700">Gaussian Jitter</text>
  </g>

  <!-- Metric Card 3: Key Rollover -->
  <g transform="translate(510, 130)">
    <rect width="180" height="52" rx="8" fill="#151618" stroke="#282a2e" stroke-width="1"/>
    <text x="14" y="21" fill="#646669" font-size="9.5" font-weight="700" letter-spacing="0.8">KEY ROLLOVER</text>
    <text x="14" y="42" fill="#4cd964" font-size="14.5" font-weight="700">Asymmetric</text>
  </g>

  <!-- Metric Card 4: Runtime -->
  <g transform="translate(702, 130)">
    <rect width="180" height="52" rx="8" fill="#151618" stroke="#282a2e" stroke-width="1"/>
    <text x="14" y="21" fill="#646669" font-size="9.5" font-weight="700" letter-spacing="0.8">RUNTIME</text>
    <text x="14" y="42" fill="#d1d0c5" font-size="14.5" font-weight="700">Manifest V3</text>
  </g>

  <!-- ================= BOTTOM SECTION (Consistency Waveform) ================= -->
  <!-- Horizontal Grid Guides -->
  <line x1="40" y1="214" x2="882" y2="214" stroke="#242629" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="244" x2="882" y2="244" stroke="#242629" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Static Base Smooth Waveform -->
  <path d="M 40,229 Q 92,203 145,229 T 250,229 T 355,229 T 460,229 T 565,229 T 670,229 T 775,229 T 880,229"
        fill="none" stroke="#2d3035" stroke-width="2.5"/>

  <!-- Animated Glowing Stream Waveform across the entire width -->
  <path d="M 40,229 Q 92,203 145,229 T 250,229 T 355,229 T 460,229 T 565,229 T 670,229 T 775,229 T 880,229"
        fill="none" stroke="url(#waveGrad)" stroke-width="2.5" class="wave-stream"/>

  <!-- Baseline -->
  <line x1="40" y1="265" x2="882" y2="265" stroke="#232528" stroke-width="1"/>

  <!-- Bottom Labels -->
  <text x="40" y="282" fill="#585c62" font-size="9.5" font-weight="600" letter-spacing="0.6">
    MODEL: CLOSED-LOOP PACING // SINE DRIFT MODULATION // DWELL SCALING
  </text>
  <text x="882" y="282" text-anchor="end" fill="#585c62" font-size="9.5" font-weight="600" letter-spacing="0.6">
    ZERO DEPENDENCIES // EXTENSION ARCHITECTURE
  </text>
</svg>
